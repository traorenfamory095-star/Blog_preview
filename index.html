<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <div class="container-img">
        <img src="./assets/images/illustration-article.svg" alt="">
      </div>
      <p class="learn-btn">
        <button type="button">Learning</button>
      </p>
      <p class="date">Published 28 july 2026</p>
      <h2>HTML & CSS foundations</h2>
      <div class="description">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit est aperiam hic neque debitis . Laboriosam velit quos minima dolorem!
      </div>
      <div class="profil">
        <span><img src="./assets/images/image-avatar.webp" alt=""></span>
        <span>N'famory Traore</span>
      </div>
    </div>
  </main>

  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">N'famory Traore</a>.
  </footer>
</body>
</html>
